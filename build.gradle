plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

version = '1.5.0'
group = 'kr.mchoe.homesystems'
base { archivesName = 'homesystems-1.20.1-forge' }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            mods { homesystems { source sourceSets.main } }
        }
        client {}
        server { args '--nogui' }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', 'homesystems'
        }
    }
}

repositories { mavenCentral() }
dependencies { minecraft 'net.minecraftforge:forge:1.20.1-47.4.0' }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
jar {
    manifest.attributes([
        'Specification-Title': 'Home Systems',
        'Specification-Version': '1',
        'Implementation-Title': project.name,
        'Implementation-Version': project.version
    ])
    finalizedBy 'reobfJar'
}
